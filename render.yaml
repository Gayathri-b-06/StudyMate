services:
  - type: web
    name: studymate-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: STUDYMATE_DATA_DIR
        value: /var/data
      - key: STUDYMATE_SECRET_KEY
        generateValue: true
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_QUIZ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: openai/gpt-oss-20b
      - key: GROQ_QUIZ_MODEL
        value: openai/gpt-oss-20b
    disk:
      name: studymate-data
      mountPath: /var/data
      sizeGB: 1
